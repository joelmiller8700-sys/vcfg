name: Build Custom VCFG PKG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Make scripts executable
        run: chmod +x tools/docker-build/*.sh

      - name: Fetch dependencies
        run: ./tools/docker-build/fetch-deps.sh

      - name: Build docker images
        run: ./tools/docker-build/build-images.sh

      - name: Run full build
        run: |
          VER=$(tr -d '[:space:]' < VERSION)
          ./tools/docker-build/build_all.sh "$PWD" "$PWD/out" "$VER"

      - name: Collect PKG and PRX files
        run: |
          mkdir -p artifacts
          find "$PWD/out" -type f \( -name '*.pkg' -o -name '*.prx' \) -exec cp {} artifacts/ \;
          ls -la artifacts

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vcfg-custom-build
          path: artifacts/*
